# Proxy de la API en api.codecomp.online (fase S7). Se despliega con:
#   npx wrangler deploy --config cloudflare/api-proxy/wrangler.toml
name = "codecomp-api"
main = "worker.js"
compatibility_date = "2026-10-01"

routes = [{ pattern = "api.codecomp.online", custom_domain = true }]

